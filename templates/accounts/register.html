{% extends "base.html" %}
{% block content %}
<h2>Create Account</h2>
<style>
	.password-toggle-wrapper {
		position: relative;
		display: block;
		width: 175px;
		max-width: 100%;
	}

	.password-toggle-wrapper input {
		width: 100%;
		max-width: 175px;
		box-sizing: border-box;
	}

	.password-toggle-button {
		position: absolute;
		top: 50%;
		right: 10px;
		transform: translateY(-50%);
		width: auto;
		padding: 0;
		border: 0;
		border-radius: 0;
		background: transparent !important;
		color: #172033;
		line-height: 1;
	}

	.password-toggle-button svg {
		display: block;
		width: 20px;
		height: 20px;
	}
</style>
<form method="post" enctype="multipart/form-data">
	{% csrf_token %}
	{{ form.as_p }}
	<button type="submit">Create Account</button>
</form>
<script>
	document.addEventListener("DOMContentLoaded", function () {
		const roleField = document.getElementById("id_role");
		const cvInput = document.getElementById("id_cv_file");
		const cvField = cvInput ? cvInput.closest("p") : null;
		const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
		const eyeSlashIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.7 18.7 0 0 1-3.1 4.1"></path><path d="M6.2 6.2C3.6 8.2 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4.2-.9"></path><path d="M9.9 9.9a3 3 0 1 0 4.2 4.2"></path></svg>';

		document.querySelectorAll('input[type="password"]').forEach(function (passwordInput) {
			const wrapper = document.createElement("span");
			const toggleButton = document.createElement("button");
			wrapper.className = "password-toggle-wrapper";
			toggleButton.type = "button";
			toggleButton.className = "password-toggle-button";
			toggleButton.setAttribute("aria-label", "Show password");
			toggleButton.innerHTML = eyeSlashIcon;

			passwordInput.parentNode.insertBefore(wrapper, passwordInput);
			wrapper.appendChild(passwordInput);
			wrapper.appendChild(toggleButton);

			toggleButton.addEventListener("click", function () {
				const isVisible = passwordInput.type === "text";
				passwordInput.type = isVisible ? "password" : "text";
				toggleButton.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
				toggleButton.innerHTML = isVisible ? eyeSlashIcon : eyeIcon;
			});
		});

		function updateCvVisibility() {
			if (!roleField || !cvInput || !cvField) {
				return;
			}
			const isInstructor = roleField.value === "instructor";
			cvField.hidden = !isInstructor;
			cvInput.required = isInstructor;
		}

		roleField.addEventListener("change", updateCvVisibility);
		updateCvVisibility();
	});
</script>
{% endblock %}
